name: WAYTEKO daily reports
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1-5'
    - cron: '43 15 * * *'
    - cron: '17 17 * * *'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Generate encrypted reports
        env:
          WAYTEKO_PW: ${{ secrets.WAYTEKO_PW }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python tools/local_reports.py "$RUNNER_TEMP/reports"
      - uses: actions/upload-artifact@v4
        with:
          name: wayteko-encrypted-reports
          path: ${{ runner.temp }}/reports/
          retention-days: 30
          if-no-files-found: error
