name: WAYTEKO semantic analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/semantic-analysis.yml']
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: write
concurrency:
  group: wayteko-semantic-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare local model
        run: |
          python -m pip install cryptography
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:3b
      - name: Analyze and publish encrypted results
        env:
          WAYTEKO_PW: ${{ secrets.WAYTEKO_PW }}
        run: |
          set -eu
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          python tools/advice.py todo "$tmp/todo.json"
          git config user.name "WAYTEKO bot"
          git config user.email "bot@wayteko.local"
          # Process all pending clients, checkpoint each small batch.
          python - "$tmp/todo.json" "$tmp" <<'PY'
          import json,sys,pathlib
          d=json.load(open(sys.argv[1]))
          for i in range(0,len(d["clients"]),4):
              pathlib.Path(sys.argv[2],f"batch_{i:06}.json").write_text(json.dumps({"today":d["today"],"clients":d["clients"][i:i+4]},ensure_ascii=False))
          PY
          for batch in "$tmp"/batch_*.json; do
            test -f "$batch" || break
            python tools/semantic_analysis.py "$batch" "$tmp/answers.json" || test -s "$tmp/answers.json"
            published=0
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python tools/advice.py apply "$tmp/answers.json"
              git add data/advice.enc.json
              if git diff --cached --quiet; then published=1; break; fi
              git commit -m "Refresh encrypted semantic analysis"
              if git push origin HEAD:main; then published=1; break; fi
            done
            test "$published" = 1
          done
          git fetch origin main
          git reset --hard origin/main
          python tools/advice.py todo "$tmp/verify.json"
