name: WAYTEKO weekly encrypted backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 0'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Create encrypted backup
        env:
          WAYTEKO_PW: ${{ secrets.WAYTEKO_PW }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/backup"
          day=$(TZ=Europe/Moscow date +%F)
          test -s data/app.enc.json
          python tools/backup_pack.py "$day" "$RUNNER_TEMP/backup/WAYTEKO_$day.json" >/dev/null
          cp data/*.enc.json "$RUNNER_TEMP/backup/"
      - uses: actions/upload-artifact@v4
        with:
          name: wayteko-encrypted-backup
          path: ${{ runner.temp }}/backup/
          retention-days: 90
          if-no-files-found: error
      - name: Email encrypted backup
        env:
          WAYTEKO_SMTP_PASSWORD: ${{ secrets.WAYTEKO_SMTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, ssl, smtplib
          from pathlib import Path
          from email.message import EmailMessage
          try:
              sender = "e.zakharov1222@gmail.com"
              msg = EmailMessage()
              msg["From"] = sender
              msg["To"] = "zaharov@wayteko.ru, e.zakharov1222@gmail.com"
              msg["Subject"] = "WAYTEKO — Зашифрованная резервная копия"
              msg.set_content("Зашифрованная резервная копия WAYTEKO во вложениях.")
              for p in sorted(Path(os.environ["RUNNER_TEMP"], "backup").glob("*.json")):
                  msg.add_attachment(p.read_bytes(), maintype="application", subtype="json", filename=p.name)
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context(), timeout=60) as smtp:
                  smtp.login(sender, os.environ["WAYTEKO_SMTP_PASSWORD"].replace(" ", ""))
                  if smtp.send_message(msg):
                      raise RuntimeError("Recipient refused")
              print("Backup sent")
          except Exception:
              raise SystemExit("Backup delivery failed")
          PY
